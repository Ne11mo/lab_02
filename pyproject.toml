[project]
name = "lab-02"
version = "0.1.0"
description = ""
authors = [
    {name = "nemo",email = "nikgovoruhin@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "pre-commit (>=4.7.0,<5.0.0)",
    "pytest (>=9.1.1,<10.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.poetry]
packages = [{ include = "streamstats", from = "src" }]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.17.0,<0.18.0)"
]
